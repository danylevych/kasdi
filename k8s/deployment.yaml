apiVersion: apps/v1
kind: Deployment
metadata:
  name: kasdi-bot
  namespace: kasdi
  labels:
    app: kasdi-bot
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: kasdi-bot
  template:
    metadata:
      labels:
        app: kasdi-bot
    spec:
      containers:
        - name: kasdi-bot
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 50m
              memory: 150Mi
            limits:
              cpu: 800m
              memory: 800Mi
