name: CI-CD to AKS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: kasdi-bot
  NAMESPACE: kasdi

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 1. Логін в Azure (потрібен для доступу до AKS)
    - name: Azure login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 2. Налаштування контексту AKS
    - name: Set AKS context
      uses: azure/aks-set-context@v4
      with:
        resource-group: 'kasdi-resource-group'
        cluster-name:  'kasdi-aks-production'

    # --- ПОЧАТОК НОВОЇ СЕКЦІЇ ЗБІРКИ (ВИРІШЕННЯ ПРОБЛЕМИ ARM) ---

    # 3. Налаштування QEMU (дозволяє збирати під ARM на звичайному сервері)
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # 4. Налаштування Docker Buildx (потужний інструмент збірки)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 5. Логін в Container Registry
    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 6. Збірка та пуш образу (Multi-arch: для Intel та ARM)
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        # Найважливіший рядок: збираємо під обидві архітектури
        platforms: linux/amd64,linux/arm64
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

    # --- КІНЕЦЬ СЕКЦІЇ ЗБІРКИ ---

    # 7. Створення Namespace (якщо немає)
    - name: Ensure namespace
      run: kubectl get ns ${{ env.NAMESPACE }} || kubectl create ns ${{ env.NAMESPACE }}

    # 8. Оновлення секретів (всі ваші ENV змінні)
    - name: Apply app-secrets
      run: |
        kubectl -n ${{ env.NAMESPACE }} delete secret app-secrets --ignore-not-found
        kubectl -n ${{ env.NAMESPACE }} create secret generic app-secrets \
          --from-literal=MONGODB_URL='${{ secrets.MONGODB_URL }}' \
          --from-literal=MONGODB_DATABASE_KSD='${{ secrets.MONGODB_DATABASE_KSD }}' \
          --from-literal=MONGODB_DATABASE_KASDI='${{ secrets.MONGODB_DATABASE_KASDI }}' \
          --from-literal=OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' \
          --from-literal=EMBEDDINGS_MODEL='${{ secrets.EMBEDDINGS_MODEL }}' \
          --from-literal=LLM_MODEL='${{ secrets.LLM_MODEL }}' \
          --from-literal=LLM_TEMPERATURE='${{ secrets.LLM_TEMPERATURE }}' \
          --from-literal=TELEGRAM_BOT_TOKEN='${{ secrets.TELEGRAM_BOT_TOKEN }}' \
          --from-literal=TAVILY_API_KEY='${{ secrets.TAVILY_API_KEY }}' \
          --from-literal=FIRE_CRAWL_API_KEY='${{ secrets.FIRE_CRAWL_API_KEY }}' \
          --from-literal=LANGSMITH_TRACING='${{ secrets.LANGSMITH_TRACING }}' \
          --from-literal=LANGSMITH_ENDPOINT='${{ secrets.LANGSMITH_ENDPOINT }}' \
          --from-literal=LANGSMITH_API_KEY='${{ secrets.LANGSMITH_API_KEY }}' \
          --from-literal=LANGSMITH_PROJECT='${{ secrets.LANGSMITH_PROJECT }}'

    # 9. Підстановка версії образу в маніфест
    - name: Render image
      run: sed -i "s|IMAGE_PLACEHOLDER|${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/deployment.yaml

    # 10. Деплой у Kubernetes
    - name: Deploy to AKS
      uses: azure/k8s-deploy@v5
      with:
        namespace: ${{ env.NAMESPACE }}
        manifests: |
          k8s/namespace.yaml
          k8s/deployment.yaml

    # 11. Перевірка статусу (тепер має пройти успішно!)
    - name: Rollout status
      run: kubectl -n ${{ env.NAMESPACE }} rollout status deploy/${{ env.IMAGE_NAME }} --timeout=180s
