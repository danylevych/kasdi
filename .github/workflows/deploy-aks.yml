name: Deploy to AKS

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: kasdi-bot
  NAMESPACE: kasdi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      - name: Build & push
        env:
          REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          IMAGE="$REGISTRY/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create namespace
        run: kubectl create ns ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy app
        run: |
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|g" k8s/deployment.yaml \
            | kubectl apply -n ${{ env.NAMESPACE }} -f -

      - name: Rollout status
        run: kubectl rollout status deploy/${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }}
